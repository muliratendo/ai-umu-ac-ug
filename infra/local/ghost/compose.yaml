name: umu-ghost-local

services:
  proxy:
    image: nginx:1.28-alpine
    networks:
      - default
      - publication
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  laravel:
    image: sail-8.4/app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    entrypoint: ["php"]
    command: ["artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      APP_NAME: "UMU AI Community"
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: "${GHOST_LOCAL_APP_KEY:?Set GHOST_LOCAL_APP_KEY}"
      APP_URL: "http://ai.umu.test:8088"
      SSO_ENABLED: "false"
      DB_CONNECTION: mysql
      DB_HOST: laravel-db
      DB_PORT: "3306"
      DB_DATABASE: umu_community_local
      DB_USERNAME: umu_community
      DB_PASSWORD: local-community-only
      SESSION_DRIVER: database
      SESSION_COOKIE: umu_community_local_session
      SESSION_DOMAIN: "null"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    volumes:
      - ../../../apps/platform:/var/www/html
    depends_on:
      laravel-db:
        condition: service_healthy

  laravel-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-community-root-only
      MYSQL_DATABASE: umu_community_local
      MYSQL_USER: umu_community
      MYSQL_PASSWORD: local-community-only
    volumes:
      - community-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ghost:
    image: ghost:6-alpine
    networks:
      - publication
    environment:
      NODE_ENV: production
      url: "http://ai.umu.test:8088/news/"
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: umu_publication
      database__connection__password: local-publication-only
      database__connection__database: umu_publication_local
      mail__from: "UMU Local Test <noreply@example.test>"
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: "1025"
      mail__options__secure: "false"
    volumes:
      - ghost-content:/var/lib/ghost/content
    depends_on:
      ghost-db:
        condition: service_healthy

  ghost-db:
    image: mysql:8.4
    networks:
      - publication
    environment:
      MYSQL_ROOT_PASSWORD: local-publication-root-only
      MYSQL_DATABASE: umu_publication_local
      MYSQL_USER: umu_publication
      MYSQL_PASSWORD: local-publication-only
    volumes:
      - publication-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    networks:
      - publication

volumes:
  community-db:
  publication-db:
  ghost-content:

networks:
  default: {}
  publication:
    internal: true
