server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ai.umu.test;
    server_tokens off;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    proxy_http_version 1.1;
    proxy_set_header Host ai.umu.test:8088;
    proxy_set_header X-Forwarded-Host ai.umu.test:8088;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    location = /news {
        return 308 http://ai.umu.test:8088/news/$is_args$args;
    }

    location /news/ {
        set $publication http://ghost:2368;
        proxy_pass $publication$request_uri;
    }

    location / {
        set $community http://laravel:8000;
        proxy_pass $community$request_uri;
    }
}
